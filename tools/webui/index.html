<!doctype html>
<html lang="zh" data-theme="light" data-theme-pref="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-undo-savepoint · 局外 WebUI</title>
  <meta name="theme-color" content="#2f8f83" />
  <!-- 主题解析必须早于样式表，否则首帧按亮色绘制再翻黑，会闪一下白。
       偏好三态存 localStorage，auto 跟随系统 prefers-color-scheme；最终落到
       data-theme 的只有 light 与 dark 两个值，样式表只认这两个值。 -->
  <script>
    (function () {
      var KEY = 'dsh-undo-theme';
      var pref = 'auto';
      try { pref = localStorage.getItem(KEY) || 'auto'; } catch (e) { /* 隐私模式读不到，按 auto 处理 */ }
      if (pref !== 'light' && pref !== 'dark' && pref !== 'auto') pref = 'auto';
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme-pref', pref);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 崩溃横幅 -->
    <div id="crash-banner" class="crash-banner hidden" role="alert"></div>

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">↶</span>
        <div class="brand-text">
          <div class="brand-title">dsh-undo-savepoint</div>
          <div class="brand-sub hidden-sm" id="subtitle">配置 / 插件 / 健康 快照</div>
        </div>
      </div>
      <div class="topbar-stats">
        <div class="stat"><span id="stat-total" class="stat-num">–</span><span class="stat-label" id="lbl-total">快照</span></div>
        <div class="stat"><span id="stat-profile" class="stat-num stat-num-sm">–</span><span class="stat-label">Profile</span></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-lang" title="语言">🌐</button>
        <button class="btn btn-ghost" id="btn-theme" title="主题">🌗</button>
        <button class="btn btn-ghost" id="btn-refresh" title="刷新">⟳</button>
        <button class="btn btn-primary" id="btn-snapshot">＋ 快照</button>
      </div>
    </header>

    <!-- 主操作区 -->
    <main class="main">
      <section class="action-strip">
        <button class="btn btn-danger" id="btn-undo">↩ 撤销</button>
        <button class="btn btn-success" id="btn-redo">↪ 重做</button>
        <div class="spacer"></div>
        <button class="btn" id="btn-safemode">🛡 安全模式</button>
        <button class="btn" id="btn-doctor">🔍 诊断</button>
        <button class="btn" id="btn-prune">🧹 清理</button>
        <button class="btn" id="btn-export">⬇ 导出</button>
        <button class="btn" id="btn-import">⬆ 导入</button>
        <button class="btn" id="btn-message">💬 对话撤回</button>
        <button class="btn" id="btn-settings">⚙ 设置</button>
      </section>

      <section class="timeline" id="timeline">
        <div class="timeline-loading" id="timeline-loading">加载中…</div>
      </section>
    </main>

    <!-- 详情/操作提示 -->
    <div id="toast" class="toast hidden"></div>

    <!-- 弹出层：diff / 设置 / 确认 -->
    <div id="overlay" class="overlay hidden">
      <div class="panel" id="panel"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
